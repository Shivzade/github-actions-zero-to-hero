# Tis will deploy safe app to prod server
name: Deploy to Server

on:
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps: 

            - name: Checkout Code
              uses: actions/checkout@v4


            - name: SSH To Prod Server & Create App folder
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY}}
                script: |
                    echo "starting Deployment"
                    mkdir -p devops
             # docker compose up -d

            - name: Copy Docker Compose file
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY}}
                source: docker-compose.yml
                target: ~/devops

            - name: SSH To Prod Server & run the app
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY}}
                script: |
                    echo "Running App"
                    sudo apt-get update
                    sudo apt-get install -y docker.io docker-compose-v2
                    sudo systemctl enable docker
                    sudo systemctl start docker
                    echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ vars.DOCKERHUB_USER }}" --password-stdin
                    cd ~/devops
                    sudo docker compose down
                    sudo docker compose up -d --force-recreate --pull always

    # sudo docker compose pull

