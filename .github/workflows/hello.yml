# This is the workflow name
name: Hello

# runs on trigger
on:
  push:
    branches: [main]

# This are jobs inside the workflow
jobs:

# This is the name of jobs
  greet:

  # This is fithub runner each job runs on github runner
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to users
        run: echo "Hello Dosto"

      - name: Say Hello to username
        run: echo "Hello $USER"
      
      
