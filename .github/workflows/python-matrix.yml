name: Python Lint

on:
    push:
        branches: [main]

jobs:
    validate:
        runs-on: ubuntu-latest
        
        steps: 
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Steup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run linter
              run: flake8 app.py
             
