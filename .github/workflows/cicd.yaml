# This is the name of workflow that will be displayed in the actions tsb
name: CICD

# Manual click deliver workflow when user needs
on:
  workflow_dispatch: 

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Chekcout Code
        run: echo "Code clone from GitHub"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build Code
        run: echo "Docker container build"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the Container
        run: echo "Testing the container"
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Docker compose deploy the app"
      
 
    
